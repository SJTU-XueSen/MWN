{% extends "base.html" %}
{% block title %}记录人生事件 - AI人生镜像{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-8 py-8">
    <div class="flex items-center gap-3 mb-6">
        <a href="/events" class="text-gray-500 hover:text-gray-300 transition"><i class="fa-solid fa-arrow-left"></i></a>
        <h2 class="text-2xl font-bold">记录人生事件</h2>
    </div>

    <form method="POST" action="/events/new" class="card p-6 space-y-5" id="event-form">
        <!-- 标题 -->
        <div>
            <label class="block text-sm text-gray-400 mb-2">事件标题 <span class="text-rose-400">*</span></label>
            <input type="text" name="title" class="input-field" placeholder="例如：第一次参加全国大学生电子设计竞赛" required autofocus maxlength="200">
        </div>

        <!-- 事件类型 -->
        <div>
            <label class="block text-sm text-gray-400 mb-3">事件类型 <span class="text-rose-400">*</span></label>
            <div class="grid grid-cols-3 gap-2" id="type-grid">
                {% for key, cfg in event_types.items() %}
                <label class="type-option flex items-center gap-2 p-2.5 rounded-xl border border-white/10 cursor-pointer hover:border-white/20 transition bg-white/3" data-type="{{ key }}">
                    <input type="radio" name="event_type" value="{{ key }}" class="hidden peer" {% if loop.first %}checked{% endif %}>
                    <span class="text-lg flex-shrink-0">{{ cfg.icon }}</span>
                    <span class="text-xs text-gray-400 peer-checked:text-gray-200">{{ cfg.label }}</span>
                </label>
                {% endfor %}
            </div>
        </div>

        <!-- 描述 -->
        <div>
            <label class="block text-sm text-gray-400 mb-2">详细描述</label>
            <textarea name="description" class="input-field" rows="6" placeholder="描述事件的经过、你的感受和收获。越详细越有助于 AI 理解你的人生轨迹。&#10;&#10;例如：大三上学期和两位同学组队参加电赛，负责嵌入式开发部分。四天三夜的比赛里第一次通宵调试硬件，虽然最终只拿了省二等奖，但这次经历让我确认自己对硬件+软件结合的方向有强烈兴趣。"></textarea>
        </div>

        <!-- 日期 -->
        <div>
            <label class="block text-sm text-gray-400 mb-2">发生日期</label>
            <input type="date" name="occurred_at" class="input-field" value="">
        </div>

        <!-- 按钮 -->
        <div class="flex gap-3 pt-2">
            <button type="submit" class="btn-primary text-white px-6 py-2.5 rounded-xl text-sm font-semibold">
                <i class="fa-solid fa-check mr-2"></i>保存事件
            </button>
            <a href="/events" class="px-6 py-2.5 rounded-xl text-sm font-medium text-gray-400 hover:text-gray-200 transition border border-white/10">
                取消
            </a>
        </div>
    </form>

    <div class="card p-5 mt-4 bg-white/2">
        <p class="text-xs text-gray-500">
            <i class="fa-solid fa-lightbulb text-amber-400 mr-1"></i>
            <strong>人生事件 vs 日常记录：</strong>日常记录是「今天发生了什么」，人生事件是「什么塑造了今天的我」—— 项目、比赛、重要决定、转折点都属于人生事件。
        </p>
    </div>
</div>

<!-- 类型选中高亮 + 日期下拉脚本 -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    // ── 类型选中高亮 ──────────────────────────
    document.querySelectorAll('.type-option input[type=radio]').forEach(radio => {
        radio.addEventListener('change', function() {
            document.querySelectorAll('.type-option').forEach(el => {
                el.classList.remove('border-indigo-400', 'bg-indigo-500/10');
                el.classList.add('border-white/10', 'bg-white/3');
            });
            const parent = this.closest('.type-option');
            parent.classList.add('border-indigo-400', 'bg-indigo-500/10');
            parent.classList.remove('bg-white/3');
        });
    });
    const checked = document.querySelector('.type-option input[type=radio]:checked');
    if (checked) {
        const parent = checked.closest('.type-option');
        parent.classList.add('border-indigo-400', 'bg-indigo-500/10');
        parent.classList.remove('bg-white/3');
    }

});
</script>
{% endblock %}
