{% extends "guest_base.html" %}
{% block title %}注册 - AI人生镜像{% endblock %}

{% block content %}
<div class="w-full max-w-md">
    <div class="text-center mb-8">
        <div class="text-5xl mb-4">🪞</div>
        <h1 class="text-2xl font-bold">AI人生镜像</h1>
        <p class="text-gray-400 mt-2 text-sm">开启你的数字人格之旅</p>
    </div>

    <div class="glass rounded-2xl p-8">
        <h2 class="text-lg font-semibold mb-6">创建账户</h2>

        {% if error %}
        <div class="bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-3 rounded-xl text-sm mb-4">
            <i class="fa-solid fa-circle-exclamation mr-2"></i>{{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/auth/register" data-no-loading>
            <div class="mb-4">
                <label class="block text-sm text-gray-400 mb-2">用户名</label>
                <input type="text" name="username" class="input-field" placeholder="2-50个字符" required autofocus>
            </div>
            <div class="mb-4">
                <label class="block text-sm text-gray-400 mb-2">真实姓名</label>
                <input type="text" name="real_name" class="input-field" placeholder="用于组队协作时的身份识别">
            </div>
            <div class="mb-4">
                <label class="block text-sm text-gray-400 mb-2">邮箱</label>
                <input type="email" name="email" class="input-field" placeholder="your@email.com" required>
            </div>
            <div class="mb-4">
                <label class="block text-sm text-gray-400 mb-2">密码</label>
                <input type="password" name="password" class="input-field" placeholder="至少6位" required>
            </div>
            <div class="mb-4">
                <label class="block text-sm text-gray-400 mb-2">确认密码</label>
                <input type="password" name="confirm_password" class="input-field" placeholder="再次输入密码" required>
            </div>
            <div class="mb-4 flex items-start gap-2">
                <input type="checkbox" name="agree_terms" value="1" class="mt-1 accent-indigo-500" required>
                <span class="text-xs text-gray-500 leading-relaxed">
                    我已阅读并同意 <a href="/legal/terms" target="_blank" class="text-indigo-400 hover:underline">用户协议</a> 和 <a href="/legal/privacy" target="_blank" class="text-indigo-400 hover:underline">隐私政策</a>
                </span>
            </div>
            <button type="submit" class="btn-primary w-full py-3 rounded-xl text-white font-semibold">
                注 册
            </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-6">
            已有账户？
            <a href="/auth/login" class="text-indigo-400 hover:underline">立即登录</a>
        </p>
    </div>

    <div class="text-center mt-6 text-xs text-gray-600">
        注册即表示同意 <a href="/legal/terms" class="text-gray-500 hover:underline">用户协议</a> 和 <a href="/legal/privacy" class="text-gray-500 hover:underline">隐私政策</a>
    </div>
</div>
{% endblock %}
