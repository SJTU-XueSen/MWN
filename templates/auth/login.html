{% extends "guest_base.html" %}
{% block title %}登录 - AI人生镜像{% endblock %}

{% block content %}
<div class="w-full max-w-md">
    <div class="text-center mb-8">
        <div class="text-5xl mb-4">🪞</div>
        <h1 class="text-2xl font-bold">AI人生镜像</h1>
        <p class="text-gray-400 mt-2 text-sm">基于数字人格的人生模拟与成长决策系统</p>
    </div>

    <div class="glass rounded-2xl p-8">
        <h2 class="text-lg font-semibold mb-6">登录</h2>

        {% if error %}
        <div class="bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-3 rounded-xl text-sm mb-4">
            <i class="fa-solid fa-circle-exclamation mr-2"></i>{{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/auth/login" data-no-loading>
            <div class="mb-4">
                <label class="block text-sm text-gray-400 mb-2">用户名</label>
                <input type="text" name="username" class="input-field" placeholder="输入用户名" required autofocus>
            </div>
            <div class="mb-6">
                <label class="block text-sm text-gray-400 mb-2">密码</label>
                <input type="password" name="password" class="input-field" placeholder="输入密码" required>
            </div>
            <button type="submit" class="btn-primary w-full py-3 rounded-xl text-white font-semibold">
                登 录
            </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-6">
            还没有账户？
            <a href="/auth/register" class="text-indigo-400 hover:underline">立即注册</a>
        </p>
    </div>

    <div class="text-center mt-6 text-xs text-gray-600">
        登录即表示同意 <a href="/legal/terms" class="text-gray-500 hover:underline">用户协议</a> 和 <a href="/legal/privacy" class="text-gray-500 hover:underline">隐私政策</a>
    </div>
</div>
{% endblock %}
