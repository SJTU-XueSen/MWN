{% extends "base.html" %}
{% block title %}生成成长报告 - AI人生镜像{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-8 py-8">
    <div class="flex items-center gap-3 mb-6">
        <a href="/reports" class="text-gray-500 hover:text-gray-300 transition"><i class="fa-solid fa-arrow-left"></i></a>
        <h2 class="text-2xl font-bold">生成成长报告</h2>
    </div>

    <form method="POST" action="/reports/generate" class="card p-6 space-y-5">
        <div>
            <label class="block text-sm text-gray-400 mb-2">报告标题</label>
            <input type="text" name="title" class="input-field" placeholder="例如：2026年7月成长总结">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm text-gray-400 mb-2">起始日期</label>
                <input type="date" name="period_start" class="input-field" value="{{ default_start }}">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">结束日期</label>
                <input type="date" name="period_end" class="input-field" value="{{ default_end }}">
            </div>
        </div>

        <div class="card p-4 bg-white/2">
            <div class="flex items-start gap-3">
                <span class="text-lg">🤖</span>
                <div>
                    <p class="text-sm text-gray-300 font-medium">AI 会分析以下内容</p>
                    <ul class="text-xs text-gray-500 mt-2 space-y-1">
                        <li>· 该时间段内的所有日常记录</li>
                        <li>· 重要人生事件</li>
                        <li>· 兴趣变化与行为模式</li>
                        <li>· 情绪趋势</li>
                        <li>· 成长建议与鼓励</li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="flex gap-3 pt-2">
            <button type="submit" class="btn-primary text-white px-6 py-2.5 rounded-xl text-sm font-semibold">
                <i class="fa-solid fa-wand-magic-sparkles mr-2"></i>开始生成
            </button>
            <a href="/reports" class="px-6 py-2.5 rounded-xl text-sm font-medium text-gray-400 hover:text-gray-200 transition border border-white/10">
                取消
            </a>
        </div>
    </form>
</div>
{% endblock %}
