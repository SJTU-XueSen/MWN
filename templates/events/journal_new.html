{% extends "base.html" %}
{% block title %}写记录 - AI人生镜像{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-8 py-8">
    <div class="flex items-center gap-3 mb-6">
        <a href="/journal" class="text-gray-500 hover:text-gray-300 transition"><i class="fa-solid fa-arrow-left"></i></a>
        <h2 class="text-2xl font-bold">记录今天的经历</h2>
    </div>

    <form method="POST" action="/journal/new" class="card p-6 space-y-5" id="journal-form">
        <div>
            <label class="block text-sm text-gray-400 mb-2">今天发生了什么？心情如何？在想什么？</label>
            <textarea name="content" class="input-field" rows="8" placeholder="例如：今天第一次参加机器人比赛，虽然输了，但在调试过程中第一次感觉自己真的喜欢把代码和硬件结合起来创造东西。这种感觉很奇妙..." required autofocus></textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm text-gray-400 mb-2">今天的心情</label>
                <input type="text" name="mood" class="input-field" placeholder="自由描述你的心情，比如：既紧张又兴奋、有点累但充实...">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">日期</label>
                <input type="date" name="record_date" class="input-field" value="">
            </div>
        </div>

        <div class="flex gap-3 pt-2">
            <button type="submit" class="btn-primary text-white px-6 py-2.5 rounded-xl text-sm font-semibold">
                <i class="fa-solid fa-paper-plane mr-2"></i>保存记录
            </button>
            <a href="/journal" class="px-6 py-2.5 rounded-xl text-sm font-medium text-gray-400 hover:text-gray-200 transition border border-white/10">
                取消
            </a>
        </div>
    </form>

    <div class="card p-5 mt-4 bg-white/2">
        <p class="text-xs text-gray-500">
            <i class="fa-solid fa-lightbulb text-amber-400 mr-1"></i>
            <strong>提示：</strong>越详细、越真实的记录，AI 越能准确地理解你。不用担心格式，想到什么写什么。
        </p>
    </div>
</div>
{% endblock %}
