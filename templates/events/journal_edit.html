{% extends "base.html" %}
{% block title %}编辑记录 - AI人生镜像{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-8 py-8">
    <div class="flex items-center gap-3 mb-6">
        <a href="/journal/{{ record.id }}" class="text-gray-500 hover:text-gray-300 transition"><i class="fa-solid fa-arrow-left"></i></a>
        <h2 class="text-2xl font-bold">编辑记录</h2>
    </div>

    <form method="POST" class="card p-6 space-y-5" id="edit-form">
        <div>
            <label class="block text-sm text-gray-400 mb-2">内容</label>
            <textarea name="content" class="input-field" rows="8" required autofocus>{{ record.content }}</textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm text-gray-400 mb-2">心情</label>
                <input type="text" name="mood" class="input-field" placeholder="自由描述你的心情..."
                       value="{{ record.mood or '' }}">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">日期</label>
                <input type="date" name="record_date" class="input-field"
                       value="{{ record.record_date.strftime('%Y-%m-%d') if record.record_date else '' }}">
            </div>
        </div>

        <div class="flex gap-3 pt-2">
            <button type="submit" class="btn-primary text-white px-6 py-2.5 rounded-xl text-sm font-semibold">
                <i class="fa-solid fa-check mr-2"></i>保存修改
            </button>
            <a href="/journal/{{ record.id }}" class="px-6 py-2.5 rounded-xl text-sm font-medium text-gray-400 hover:text-gray-200 transition border border-white/10">
                取消
            </a>
        </div>
    </form>

    <div class="card p-5 mt-4 bg-white/2">
        <p class="text-xs text-gray-500">
            <i class="fa-solid fa-info-circle mr-1"></i>
            修改后 AI 会重新分析此记录。
        </p>
    </div>
</div>
{% endblock %}
