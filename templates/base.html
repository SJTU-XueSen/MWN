<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI人生镜像{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        body { background: #0F0F23; color: #E2E8F0; }
        .sidebar { background: rgba(15,15,40,0.95); border-right: 1px solid rgba(255,255,255,0.06); }
        .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.06); }
        .nav-item { transition: all 0.2s ease; border-radius: 10px; margin: 1px 8px; color: #94A3B8; }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: #E2E8F0; }
        .nav-item.active { background: rgba(99,102,241,0.15); color: #A5B4FC; }
        .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; transition: all 0.2s; }
        .card:hover { border-color: rgba(255,255,255,0.12); }
        .btn-primary { background: linear-gradient(135deg, #6366F1, #8B5CF6); transition: all 0.2s; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(99,102,241,0.4); }
        .input-field { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #E2E8F0; border-radius: 10px; padding: 10px 14px; width: 100%; outline: none; transition: border 0.2s; }
        .input-field:focus { border-color: #818CF8; }
        .tag { font-size: 0.7rem; padding: 2px 8px; border-radius: 6px; font-weight: 600; }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="flex h-screen overflow-hidden">
    <!-- 侧边栏 -->
    <aside class="sidebar w-56 flex-shrink-0 flex flex-col">
        <div class="px-5 py-6 border-b border-white/5">
            <a href="/" class="flex items-center gap-2.5 no-underline">
                <span class="text-2xl">🪞</span>
                <div>
                    <h1 class="font-bold text-sm text-white">AI人生镜像</h1>
                    <p class="text-xs text-gray-500">Life Mirror</p>
                </div>
            </a>
        </div>

        <nav class="flex-1 px-2 py-4 space-y-0.5">
            <p class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">探索</p>
            <a href="/" class="nav-item flex items-center gap-3 px-3 py-2.5 text-sm font-medium {{ 'active' if active == 'index' else '' }}">
                <i class="fa-solid fa-house w-4 text-center"></i> 首页
            </a>
            <a href="/journal" class="nav-item flex items-center gap-3 px-3 py-2.5 text-sm font-medium {{ 'active' if active == 'journal' else '' }}">
                <i class="fa-solid fa-pen-to-square w-4 text-center"></i> 日常记录
            </a>
            <a href="/events" class="nav-item flex items-center gap-3 px-3 py-2.5 text-sm font-medium {{ 'active' if active == 'events' else '' }}">
                <i class="fa-solid fa-timeline w-4 text-center"></i> 人生地图
            </a>
            <a href="/persona" class="nav-item flex items-center gap-3 px-3 py-2.5 text-sm font-medium {{ 'active' if active == 'persona' else '' }}">
                <i class="fa-solid fa-fingerprint w-4 text-center"></i> 数字人格
            </a>
            <a href="/goals" class="nav-item flex items-center gap-3 px-3 py-2.5 text-sm font-medium {{ 'active' if active == 'goals' else '' }}">
                <i class="fa-solid fa-bullseye w-4 text-center"></i> 人生目标
            </a>
            <a href="/references" class="nav-item flex items-center gap-3 px-3 py-2.5 text-sm font-medium {{ 'active' if active == 'references' else '' }}">
                <i class="fa-solid fa-globe w-4 text-center"></i> 人生参考
            </a>

            <p class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider mt-5 mb-2">实验室</p>
            <a href="/simulation" class="nav-item flex items-center gap-3 px-3 py-2.5 text-sm font-medium {{ 'active' if active == 'simulation' else '' }}">
                <i class="fa-solid fa-flask w-4 text-center"></i> 人生模拟
            </a>
            <a href="/future-chat" class="nav-item flex items-center gap-3 px-3 py-2.5 text-sm font-medium {{ 'active' if active == 'future_chat' else '' }}">
                <i class="fa-solid fa-comment-dots w-4 text-center"></i> 未来对话
            </a>
            <a href="/reports" class="nav-item flex items-center gap-3 px-3 py-2.5 text-sm font-medium {{ 'active' if active == 'reports' else '' }}">
                <i class="fa-solid fa-chart-line w-4 text-center"></i> 成长报告
            </a>
        </nav>

        <div class="px-2 py-4 border-t border-white/5">
            <a href="/auth/profile" class="nav-item flex items-center gap-3 px-3 py-2.5 text-sm font-medium {{ 'active' if active == 'profile' else '' }}">
                <i class="fa-solid fa-user-gear w-4 text-center"></i> 个人资料
            </a>
            <a href="/settings" class="nav-item flex items-center gap-3 px-3 py-2.5 text-sm font-medium {{ 'active' if active == 'settings' else '' }}">
                <i class="fa-solid fa-shield-halved w-4 text-center"></i> 隐私与数据
            </a>
            <a href="/auth/logout" class="nav-item flex items-center gap-3 px-3 py-2.5 text-sm font-medium text-red-400 hover:text-red-300">
                <i class="fa-solid fa-right-from-bracket w-4 text-center"></i> 退出登录
            </a>
        </div>

        <div class="px-4 pb-4">
            <div class="glass rounded-xl p-3 text-xs text-gray-500">
                <span>{{ user.username }}</span>
                <span class="mx-1">·</span>
                <span>v1.0</span>
            </div>
        </div>
    </aside>

    <!-- 主内容区 -->
    <main class="flex-1 overflow-y-auto">
        {% block content %}{% endblock %}
    </main>

    <!-- Loading 遮罩 -->
    <div id="loading-overlay" class="fixed inset-0 z-50 flex items-center justify-center hidden"
         style="background: rgba(15,15,35,0.85); backdrop-filter: blur(4px);">
        <div class="text-center">
            <div class="inline-block w-10 h-10 border-3 border-indigo-500/30 border-t-indigo-400 rounded-full animate-spin mb-4"></div>
            <p class="text-gray-300 text-sm font-medium">AI 正在分析中...</p>
            <p class="text-gray-600 text-xs mt-1">请勿关闭页面</p>
        </div>
    </div>

    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
        .animate-spin { animation: spin 0.8s linear infinite; }
        .border-3 { border-width: 3px; }
    </style>

    <script>
    (function() {
        const overlay = document.getElementById('loading-overlay');

        // ── 所有表单提交：显示 loading + 禁用按钮 ──
        document.addEventListener('submit', function(e) {
            const form = e.target.closest('form');
            if (!form) return;

            // 跳过搜索/过滤等非提交表单
            const method = (form.method || 'GET').toUpperCase();
            if (method !== 'POST') return;

            // 检查是否需要 loading（有 data-no-loading 属性的跳过）
            if (form.hasAttribute('data-no-loading')) return;

            // 显示遮罩
            if (overlay) overlay.classList.remove('hidden');

            // 禁用提交按钮
            const btn = form.querySelector('button[type="submit"]');
            if (btn) {
                btn.disabled = true;
                const originalHTML = btn.innerHTML;
                btn.setAttribute('data-original-html', originalHTML);
                btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin mr-2"></i>生成中...';
                btn.style.opacity = '0.6';
                btn.style.pointerEvents = 'none';
            }
        });

        // ── 页面访问追踪 ──
        fetch('/track', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({path: window.location.pathname}),
        }).catch(() => {});

        // ── GET 链接防重复：带 data-loading 属性的链接点击时显示遮罩 ──
        document.addEventListener('click', function(e) {
            const link = e.target.closest('a[data-loading]');
            if (!link) return;
            if (overlay) overlay.classList.remove('hidden');
        });
    })();
    </script>
</body>
</html>
